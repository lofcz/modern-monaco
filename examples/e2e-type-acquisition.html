<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Type acquisition regression</title>
  <script type="importmap">
    {"imports":{
      "modern-monaco":"/modern-monaco/index.mjs",
      "modern-monaco/workspace":"/modern-monaco/workspace.mjs",
      "modern-monaco/editor-core":"/modern-monaco/editor-core.mjs",
      "modern-monaco/lsp":"/modern-monaco/lsp/index.mjs"
    }}
  </script>
</head>
<body>
  <div id="editor" style="height:400px"></div>
  <script type="module">
    import { init } from "modern-monaco";
    import { Workspace } from "modern-monaco/workspace";
    import { waitForTypeResolution } from "/modern-monaco/lsp/typescript/setup.mjs";

    const params = new URL(location.href).searchParams;
    const late = params.has("late");
    // `local`: only main.ts is opened; its imports must be opened in the background.
    const local = params.has("local");
    // `api`: API query fixtures, never opened as models up front.
    const api = params.has("api");
    const files = api ? {
      "main.ts": "export const ok = 1;",
      "lib/api.ts": `export { Base as Camera } from "./base";
/** Creates lighting. @deprecated Use a pipeline. */
export function light(value: number): number;
export function light(value: string): string;
export function light(value: number | string) { return value; }
export interface Options { intensity: number; }
export type Context = { options: Options };
export namespace Shapes { export interface Box { width: number } export const unit = 1; }`,
      "lib/base.ts": `class Parent {
  /** Advance time. */
  update(delta: number): void {}
}
/** A test camera. */
export class Base extends Parent { fov = 50; }`,
    } : local ? {
      "main.ts": 'import { n } from "./util.js"; import data from "./data.json"; export const a: string = n; export const b: string = data.count;',
      "util.ts": "export const n: number = 1;",
      "data.json": '{ "count": 1 }',
    } : late ? {
      "main.ts": 'import { count } from "./late"; export const value: string = count;',
    } : {
      "main.ts": 'import App from "./App"; import { useStore } from "./state"; export const value: string = useStore.getState().count; export const rendered = App();',
      "App.tsx": 'import { useStore } from "./state"; export default function App() { return useStore.getState().count; }',
      "state/index.ts": 'export { useStore } from "store-lib";',
    };
    const workspace = new Workspace({ name: "e2e-type-acquisition-" + Date.now() });
    if (api) await workspace.fs.createDirectory("lib");
    else if (!late && !local) await workspace.fs.createDirectory("state");
    for (const [path, content] of Object.entries(files)) await workspace.fs.writeFile(path, content);
    const monaco = await init({
      workspace,
      lsp: { typescript: {
        compilerOptions: { strict: true, jsx: "preserve", resolveJsonModule: true, moduleResolution: "bundler", module: "esnext" },
        importMap: { imports: {
          "store-lib": location.origin + "/type-acquisition/store/index.d.ts",
          "store-core": location.origin + "/type-acquisition/core",
        } },
      } },
    });
    const editor = monaco.editor.create(document.getElementById("editor"));
    await workspace.openTextDocument("main.ts");
    for (const [path, content] of local || api ? [] : Object.entries(files)) {
      const uri = monaco.Uri.file(path);
      if (!monaco.editor.getModel(uri)) monaco.editor.createModel(content, undefined, uri);
    }
    window.__e2e = {
      monaco, editor, workspace,
      settle: () => waitForTypeResolution(monaco.editor.getModels().map(model => model.uri)),
    };
  </script>
</body>
</html>
